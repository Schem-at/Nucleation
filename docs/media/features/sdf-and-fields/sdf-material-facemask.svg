<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" width="960" height="390" role="img" aria-labelledby="mat-title mat-desc">
  <title id="mat-title">VoxelPipeline Material Passes and 6-Bit Face Mask</title>
  <desc id="mat-desc">Left panel shows a voxel terrain cutaway with ExposedFace moss cap, DepthBelowSurface dirt, WorldY rock strata, FluidLayer water pool, and Top/Bottom ScatterRule grass and vines. Right panel shows an isometric voxel cube with the six face_mask bit values.</desc>
  <defs>
    <pattern id="mat-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>
    <style>
      .mono { font-family: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace; }
      .sans { font-family: "Inter", system-ui, -apple-system, sans-serif; }
      .h2 { font-size: 14px; font-weight: 600; fill: #F6F8FA; }
      .sub { font-size: 11.5px; fill: #8A93A3; }
      .lbl { font-size: 11px; font-weight: 600; fill: #F6F8FA; }
      .lbl-sub { font-size: 10px; fill: #8A93A3; }
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="959" height="389" fill="#12161C" stroke="#2A313D"/>
  <rect x="1" y="1" width="958" height="388" fill="url(#mat-grid)"/>

  <!-- Divider between Left (Terrain Cutaway) and Right (face_mask Cube) -->
  <line x1="570" y1="20" x2="570" y2="370" stroke="#2A313D" stroke-width="1"/>

  <!-- ==================== LEFT PANEL: CUTAWAY ==================== -->
  <text x="32" y="36" class="mono h2">VoxelPipeline Column Cutaway</text>
  <text x="32" y="54" class="sans sub">How Conditions, Channels, FluidLayer, and ScatterRule stack on one Field</text>

  <!-- Cutaway frame -->
  <rect x="31.5" y="91.5" width="309" height="225" fill="#161A21" stroke="#3D4657"/>
  <g>
    <rect x="32" y="288" width="28" height="28" fill="#4B5260" stroke="#12161C" stroke-width="1"/>
    <rect x="32" y="260" width="28" height="28" fill="#4B5260" stroke="#12161C" stroke-width="1"/>
    <rect x="32" y="232" width="28" height="28" fill="#7A828F" stroke="#12161C" stroke-width="1"/>
    <rect x="32" y="204" width="28" height="28" fill="#7A828F" stroke="#12161C" stroke-width="1"/>
    <rect x="32" y="176" width="28" height="28" fill="#9E734E" stroke="#12161C" stroke-width="1"/>
    <rect x="32" y="148" width="28" height="28" fill="#6BC47D" stroke="#12161C" stroke-width="1"/>
    <rect x="60" y="288" width="28" height="28" fill="#4B5260" stroke="#12161C" stroke-width="1"/>
    <rect x="60" y="260" width="28" height="28" fill="#4B5260" stroke="#12161C" stroke-width="1"/>
    <rect x="60" y="232" width="28" height="28" fill="#7A828F" stroke="#12161C" stroke-width="1"/>
