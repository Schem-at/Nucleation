<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-labelledby="title desc">
  <title id="title">One annotated Rust bridge generating six foreign language bindings</title>
  <desc id="desc">The Rust core and annotated bridge feed Diplomat code generation. Generated bindings target JavaScript and TypeScript, Python, Kotlin and JVM, PHP, C, and C plus plus while native Rust calls the core directly.</desc>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#657184"/></marker></defs>
  <rect width="960" height="430" rx="18" fill="#11151b"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <g transform="translate(28 108)">
      <rect width="220" height="132" rx="14" fill="#171c24" stroke="#e4774e" stroke-width="2"/>
      <text x="22" y="35" fill="#8d99aa" font-size="13">NATIVE SURFACE</text>
      <text x="22" y="70" fill="#f4f7fb" font-size="20">Rust core</text>
      <text x="22" y="96" fill="#e4774e" font-size="13">src/bridge annotations</text>
    </g>
    <path d="M248 174h104" stroke="#657184" stroke-width="3" marker-end="url(#a)"/>
    <g transform="translate(356 126)">
      <rect width="190" height="96" rx="48" fill="#171c24" stroke="#4ec9b0" stroke-width="2"/>
      <text x="48" y="43" fill="#f4f7fb" font-size="20">Diplomat</text>
      <text x="40" y="66" fill="#8d99aa" font-size="12">generated contracts</text>
    </g>
    <g stroke="#657184" stroke-width="2" marker-end="url(#a)">
      <path d="M546 160C610 160 604 53 654 53"/><path d="M546 166C610 166 604 113 654 113"/>
      <path d="M546 174h108"/><path d="M546 182C610 182 604 233 654 233"/>
      <path d="M546 188C610 188 604 293 654 293"/><path d="M546 194C610 194 604 353 654 353"/>
    </g>
    <g transform="translate(654 24)" font-size="14">
      <g fill="#171c24" stroke="#343d4b"><rect width="278" height="52" rx="8"/><rect y="60" width="278" height="52" rx="8"/><rect y="120" width="278" height="52" rx="8"/><rect y="180" width="278" height="52" rx="8"/><rect y="240" width="278" height="52" rx="8"/><rect y="300" width="278" height="52" rx="8"/></g>
      <g fill="#f4f7fb"><text x="18" y="31">JavaScript / TypeScript · WASM</text><text x="18" y="91">Python · nanobind native module</text><text x="18" y="151">Kotlin / JVM · JNA</text><text x="18" y="211">PHP · FFI</text><text x="18" y="271">C · stable ABI headers</text><text x="18" y="331">C++ · typed C ABI wrappers</text></g>
    </g>
