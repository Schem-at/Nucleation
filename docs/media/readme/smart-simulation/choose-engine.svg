<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">Choose a Nucleation authoring or simulation path</title>
  <desc id="desc">Four panels map comparator inventory authoring to signal shorthand, derived block placement to simulated placement, fast repeated circuit evaluation to MCHPRS, and ordered world mechanics to TickSimulation.</desc>
  <rect width="960" height="420" rx="18" fill="#11151b"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="28" y="42" fill="#f4f7fb" font-size="18">WHAT MUST THE RESULT PRESERVE?</text>
    <path d="M480 64v28M122 92h716" stroke="#4a5566" stroke-width="2"/>
    <g transform="translate(18 92)">
      <rect width="222" height="304" rx="12" fill="#171c24" stroke="#343d4b"/>
      <circle cx="111" cy="54" r="24" fill="#d4aa45" opacity=".22" stroke="#d4aa45" stroke-width="2"/>
      <path d="M100 54h22M111 43v22" stroke="#d4aa45" stroke-width="3"/>
      <text x="18" y="104" fill="#8d99aa" font-size="13">COMPARATOR VALUE</text>
      <text x="18" y="140" fill="#f4f7fb" font-size="18">signal=13</text>
      <text x="18" y="176" fill="#8d99aa" font-size="12">author inventory NBT</text>
      <text x="18" y="198" fill="#8d99aa" font-size="12">no clock is advanced</text>
      <text x="18" y="262" fill="#d4aa45" font-size="12">DESCRIPTOR SHORTHAND</text>
    </g>
    <g transform="translate(252 92)">
      <rect width="222" height="304" rx="12" fill="#171c24" stroke="#343d4b"/>
      <g fill="#4ec9b0"><circle cx="67" cy="54" r="9"/><circle cx="111" cy="54" r="9"/><circle cx="155" cy="54" r="9"/></g>
      <path d="M76 54h26M120 54h26" stroke="#4ec9b0" stroke-width="3"/>
      <text x="18" y="104" fill="#8d99aa" font-size="13">PLACED BLOCK STATE</text>
      <text x="18" y="140" fill="#f4f7fb" font-size="18">simulate=true</text>
      <text x="18" y="176" fill="#8d99aa" font-size="12">derive connections</text>
      <text x="18" y="198" fill="#8d99aa" font-size="12">settle local effects</text>
      <text x="18" y="262" fill="#4ec9b0" font-size="12">SMART AUTHORING</text>
    </g>
    <g transform="translate(486 92)">
      <rect width="222" height="304" rx="12" fill="#171c24" stroke="#343d4b"/>
      <path d="M54 69h27l14-30 26 54 15-36h32" fill="none" stroke="#7386d5" stroke-width="4" stroke-linejoin="round"/>
      <text x="18" y="104" fill="#8d99aa" font-size="13">CIRCUIT OUTPUT</text>
      <text x="18" y="140" fill="#f4f7fb" font-size="18">MchprsWorld</text>
      <text x="18" y="176" fill="#8d99aa" font-size="12">compile the circuit</text>
      <text x="18" y="198" fill="#8d99aa" font-size="12">probe many inputs</text>
      <text x="18" y="262" fill="#7386d5" font-size="12">FAST LOGIC EVALUATION</text>
    </g>
    <g transform="translate(720 92)">
      <rect width="222" height="304" rx="12" fill="#171c24" stroke="#343d4b"/>
      <circle cx="111" cy="58" r="34" fill="none" stroke="#e4774e" stroke-width="3"/>
      <path d="M111 58V35M111 58l18 11" stroke="#e4774e" stroke-width="3" stroke-linecap="round"/>
      <text x="18" y="104" fill="#8d99aa" font-size="13">WORLD OVER TIME</text>
      <text x="18" y="140" fill="#f4f7fb" font-size="18">TickSimulation</text>
      <text x="18" y="176" fill="#8d99aa" font-size="12">preserve tick order</text>
      <text x="18" y="198" fill="#8d99aa" font-size="12">pistons, fluids, entities</text>
      <text x="18" y="262" fill="#e4774e" font-size="12">FULL MECHANICS</text>
    </g>
  </g>
</svg>
