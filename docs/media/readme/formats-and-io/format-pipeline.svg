<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380" role="img" aria-labelledby="title desc">
  <title id="title">Nucleation format input and output pipeline</title>
  <desc id="desc">Content detectors identify six input families and load one editable schematic model. Explicit exporters then write Litematica, Sponge, Bedrock, structure SNBT, snapshots, or worlds.</desc>
