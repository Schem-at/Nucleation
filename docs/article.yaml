slug: nucleation
title: Nucleation
form: docs
status: published
category: documentation
tags: [minecraft, schematics, rust, python, javascript]

# Metadata below drives the index card, the SEO/OG tags and the JSON-LD Article.
# `site_url` is required for canonical, og:url, og:image and sitemap.xml — without
# it pagina omits them all and warns per page. Value carried over from mkdocs.yml.
#
# It is the FALLBACK, not the deployment address. This article has more than one
# home — schemat.io and a GitHub Pages mirror — so where a build is served is a
# build-time input, passed as the full URL:
#     pagina build docs --site-url https://schem-at.github.io/Nucleation/pagina/
# pagina takes the path of that URL as the site base, so one flag gives both the
# asset URLs and the canonical. tools/build-pagina-mirror.sh is what CI runs.
#
# The value below carries a path, which pagina reads only the origin of, so a build
# that does NOT pass --site-url will warn (`seo-site-url-path-ignored`) rather than
# silently emit canonical https://schem-at.github.io/. It used to do exactly that.
description: Load, build, simulate, mesh, and render Minecraft schematics from one Rust core and six generated bindings.
author: Nucleation contributors
site_url: https://schem-at.github.io/Nucleation/
cover: media/gallery-montage.png
cover_alt: Four builds generated and rendered by Nucleation — a fractal sponge, a torus knot, a fox, and a tree

kineglyph:
  theme: theme/kineglyph.mjs
  width: 960
snippets:
  roots: [".", ".."]        # ".." because --8<-- paths are repo-root relative (examples/…)

