[package]
name = "nucleation-cli"
version = "0.1.0"
edition = "2021"
description = "The nucleation CLI: inspect, test, convert, render — with a TUI shell"
license = "MIT"

[[bin]]
name = "nucleation"
path = "src/main.rs"

[dependencies]
nucleation = { path = "../.." }
mc-test = { path = "../mc-test" }
serde_json = "1"
ratatui = "0.29"

[features]
# The `render` subcommand needs nucleation's GPU pipeline (wgpu). Off by
# default so the CLI builds fast; everything else works without it.
render = ["nucleation/rendering"]
