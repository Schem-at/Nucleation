[package]
name = "nucleation-cli"
version = "0.1.0"
edition = "2021"
description = "The nucleation CLI: inspect, test, convert, render — with a TUI shell"
license = "MIT"

[[bin]]
name = "nucleation"
path = "src/main.rs"

[dependencies]
nucleation = { path = "../.." }
mc-test = { path = "../mc-test" }
serde_json = "1"
ratatui = "0.29"
ratatui-image = "8"
image = "0.25.10"

[features]
# The `render` subcommand needs nucleation's GPU pipeline (wgpu). Off by
# default so the CLI builds fast; everything else works without it.
render = ["nucleation/rendering"]
# The `mesh` subcommand needs only the mesher, no GPU. `render` implies it
# (nucleation's rendering feature builds on meshing).
mesh = ["nucleation/meshing"]
