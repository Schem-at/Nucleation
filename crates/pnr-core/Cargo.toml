[package]
name = "pnr-core"
version = "0.1.0"
edition = "2021"
description = "Fabric-agnostic place-and-route algorithms: grid A*, negotiated congestion, interval colouring, union-find net checking, simulated annealing, generic STA"
license = "MIT"

# Zero dependencies on purpose: this crate is pure algorithms behind the
