[package]
name = "nucleation-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
nucleation = { path = "..", default-features = false }

[[bin]]
name = "bounded_decode"
path = "fuzz_targets/bounded_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "policy_json"
path = "fuzz_targets/policy_json.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
